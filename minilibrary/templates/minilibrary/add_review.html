{% extends "base.html" %}

{% block content %}
<h1>Agrega una rezeña de {{book.title}} </h1>

{% if messages %}
{% for message in messages %}
<div class="alert alert-{{message.tags}}">
    {{message}}

</div>

{% endfor %}
{% endif %}


<form method="post">
    {% csrf_token %}
    {{form.as_p}}
    <button type="submit">Enviar reseña</button>


</form>

{% endblock content %}
